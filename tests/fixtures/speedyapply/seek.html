<!doctype html><html><head ><title>Fictional adapter fixture</title></head><body><ol><li><button tabindex="0" aria-current="step">SEEK profile</button></li></ol>
<div data-automation="career-history-section"><button data-automation="add-role" onclick="openRole()">Add</button></div><div data-automation="education-section"></div>
<script>function openRole(){if(document.querySelector('[data-automation="career-history-form-drawer"]'))return;const d=document.createElement('div');d.dataset.automation='career-history-form-drawer';d.dataset.internGroup='experience';d.innerHTML=`<label>Job Title<input data-automation="role-title"></label><label>Company<input data-automation="company-name"></label><label>Description<textarea data-automation="career-history-achievements"></textarea></label><button data-automation="career-history-save-button" onclick="saveRole(this)">Save</button>`;document.body.append(d);}function saveRole(button){setTimeout(()=>{const drawer=button.parentElement;window.savedRows=[...drawer.querySelectorAll('input,textarea')].map(e=>e.value);const summary=drawer.cloneNode(true);summary.removeAttribute('data-automation');summary.querySelector('button').remove();summary.querySelectorAll('input,textarea').forEach(e=>e.readOnly=true);document.querySelector('[data-automation="career-history-section"]').append(summary);drawer.remove();},20);}</script><button type="button" data-testid="continue-button">Next</button></body></html>
