<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fictional Workday fixture</title></head>
<body><main id="main"></main><script>
const main = document.getElementById('main');
window.stage = 0; window.saved = []; window.submissions = 0;
const escapeHTML = s => String(s).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('"','&quot;');
function input(label, attrs='') {return `<label>${label}<input ${attrs}></label>`;}
function row(group) {
  const div = document.createElement('div'); div.dataset.internRow='';
  div.innerHTML = group === 'education' ? input('School','required') + input('Degree','required') : input('Company','required') + input('Job Title','required');
  document.querySelector(`[data-intern-group="${group}"]`).insertBefore(div, document.querySelector(`[data-intern-group="${group}"] button`));
}
function save() {
  if ([...main.querySelectorAll('input,select')].some(e=>!e.checkValidity())) return false;
  const rows = [...main.querySelectorAll('input,select')].map(e => {
    const container = e.closest('[data-intern-group]'); const row = e.closest('[data-intern-row]');
    return {label:e.labels[0].childNodes[0].textContent.trim(), group:container?.dataset.internGroup || '',
      row: row ? [...container.querySelectorAll('[data-intern-row]')].indexOf(row) : 0,
      value: e.type === 'checkbox' ? String(e.checked) : e.type === 'file' ? e.files[0]?.name || '' : e.tagName === 'SELECT' ? e.selectedOptions[0].text : e.value};
  });
  window.saved = window.saved.concat(rows); return true;
}
function next() {if(save()) {window.stage++; render();}}
function render() {
  if(stage === 0) main.innerHTML='<h2>Upload Resume</h2>'+input('Resume','type="file" required')+'<button onclick="next()">Next</button>';
  if(stage === 1) main.innerHTML='<h2>My Information</h2>'+input('First Name','required')+input('Last Name','required')+'<label>Country<select required><option value="">Choose</option><option value="SG">Singapore</option></select></label><button onclick="next()">Next</button>';
  if(stage === 2) main.innerHTML='<h2>My Experience</h2><section data-intern-group="education"><button onclick="row(\'education\')">Add</button></section><section data-intern-group="experience"><button onclick="row(\'experience\')">Add</button></section><button onclick="next()">Next</button>';
  if(stage === 3) main.innerHTML='<h2>Application Questions</h2>'+input('Available for this internship?','type="checkbox" onchange="conditional()"')+'<div id="conditional"></div><button onclick="next()">Next</button>';
  if(stage === 4) main.innerHTML='<h2>Review</h2>'+saved.map(s=>`<div data-intern-review data-label="${escapeHTML(s.label)}" data-value="${escapeHTML(s.value)}" data-group="${s.group}" data-row="${s.row}">${escapeHTML(s.label)}: ${escapeHTML(s.value)}</div>`).join('')+'<button onclick="window.submissions++">Submit Application</button>';
}
function conditional() {document.getElementById('conditional').innerHTML=main.querySelector('input').checked ? input('Start Date','type="date" required') : '';}
render();
</script></body></html>
