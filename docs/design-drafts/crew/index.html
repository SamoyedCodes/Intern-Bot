<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Application crew · Intern-Bot</title>
<style>
*{box-sizing:border-box} :root{color-scheme:light;--paper:#f7f6f1;--ink:#182b29;--line:#c9d1c7;--action:#ba431f;--field:#d7e5de;--panel:#193530;--light:#f5f5e8;--signal:#ffad75;font-family:"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper)}body{margin:0}button,select{font:inherit;color:inherit}button,select{cursor:pointer}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid #1687c7;outline-offset:3px}button{border:0;background:none}button:disabled{cursor:default}button:not(:disabled):hover{filter:brightness(.91)}[hidden]{display:none!important}.mono,.label,.counter,.stage small,.record small,.status,select,.events time,.hint{font-family:"SFMono-Regular",Menlo,Consolas,monospace}.label,.status,.hint{font-size:11px;letter-spacing:.055em}.label{text-transform:uppercase}.shell{max-width:1710px;margin:auto;padding:0 clamp(18px,3.5vw,66px) 28px}.top{min-height:70px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:18px}.brand{font-size:20px;font-weight:750;letter-spacing:-.055em;display:flex;align-items:center;gap:10px}.brand,.markDemo,.restart{white-space:nowrap}.brand svg{width:33px;height:32px}.crumb{padding-left:17px;border-left:1px solid var(--line);font-size:14px}.markDemo{margin-left:auto;font-size:12px;font-weight:600}.markDemo i,.status i{display:inline-block;width:7px;height:7px;border-radius:100%;background:currentColor;margin-right:8px}.restart{border:1px solid var(--line);padding:7px 12px;border-radius:5px;font-size:13px}.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:27px 0 22px}.mast h1{font-family:"Avenir Next","Helvetica Neue",sans-serif;font-size:clamp(33px,4.2vw,66px);line-height:1;margin:0;letter-spacing:-.058em;font-weight:650}.switch{display:inline-flex;padding:3px;white-space:nowrap;border:1px solid var(--line);border-radius:8px;gap:2px}.switch button{padding:9px 13px;border-radius:5px;font-size:13px;font-weight:600}.switch button[aria-pressed=true]{color:var(--paper);background:var(--ink)}.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(285px,29%);border:1px solid var(--line);border-radius:12px;overflow:hidden}.left{display:flex;flex-direction:column;min-width:0;background:var(--field)}.stage{position:relative;height:clamp(335px,33vw,510px);min-width:0;isolation:isolate}.stage canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}.stage canvas:active{cursor:grabbing}.stageHead{position:absolute;top:20px;left:21px;z-index:1;pointer-events:none}.stageHead strong{display:block;font-size:17px;letter-spacing:-.025em;margin:4px 0}.hint{position:absolute;bottom:12px;left:20px;pointer-events:none;color:#3e574d;letter-spacing:0}.legend{position:absolute;bottom:12px;right:18px;font-size:11px;opacity:.85}.stageNav{background:var(--paper);border-top:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px;min-height:54px}.phaseDot{flex:0 0 auto;width:9px;height:9px;background:var(--action);border-radius:50%}.stageNav span#live{font-size:13px}.stageNav button{margin-left:auto;white-space:nowrap;padding:4px 8px;font-size:12px;font-weight:650;text-decoration:underline;text-underline-offset:3px}.side{background:var(--panel);color:var(--light);padding:clamp(19px,2.2vw,34px);display:flex;flex-direction:column;gap:16px}.sideTop{display:flex;align-items:center;justify-content:space-between;gap:8px}.sideTop .label{color:#c0d1bd}.status{color:var(--signal);letter-spacing:0}.side h2{font-family:"Avenir Next","Helvetica Neue",sans-serif;letter-spacing:-.052em;font-size:clamp(30px,3vw,52px);line-height:1.03;margin:0}.role{margin:-9px 0 0;font-size:13px;color:#d7e4d6}.meter{padding:14px 0;border-top:1px solid #ffffff36;border-bottom:1px solid #ffffff36}.meter .bar{display:flex;gap:4px;height:8px;margin-top:10px}.bar b{flex:1;display:block;border:1px solid #90a49c}.bar b.on{background:#c1dbaf;border-color:#c1dbaf}.meter strong{font-size:20px}.meter small{font-size:12px;margin-left:6px}.task{margin:auto 0 0}.task h3{font-size:clamp(17px,1.4vw,23px);line-height:1.25;margin:0 0 8px;letter-spacing:-.025em}.task p{font-size:13px;line-height:1.48;color:#d6e1d7;margin:0 0 12px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions button{font-weight:650;padding:10px 13px;border-radius:5px;font-size:13px;background:var(--signal);color:#18231b}.actions button.secondary{background:transparent;color:var(--light);border:1px solid #a3b2aa}.lower{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:clamp(24px,5vw,90px);padding-top:23px}.lower h2{font-size:17px;letter-spacing:-.03em;margin:0 0 9px}.records,.events{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}.record{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:9px 7px;border-bottom:1px solid var(--line);font-size:13px}.record[aria-pressed=true]{background:#e6ebe0}.record b{font-size:13px}.record small{margin-left:auto;font-size:11px}.events li{font-size:13px;display:flex;gap:14px;padding:9px 0;border-bottom:1px solid var(--line)}.events time{font-size:11px;color:#52625c;min-width:38px}.record .index{color:#64746b;font-size:11px}.field{--paper:#f5f4ef;--ink:#151614;--line:#c2c4b9;--field:#1d211e;--panel:#282d28;--signal:#d8f87c;--action:#4b681d}.field .stageHead,.field .legend,.field .hint{color:#e1e4d6}.field .bar b.on{background:#d8f87c;border-color:#d8f87c}.fallback{position:absolute;inset:35% 10% auto;text-align:center;line-height:1.5}.field .fallback{color:white}button:disabled{opacity:.5}::selection{background:#f2ab77;color:#182b29}
@media(max-width:830px){.shell{padding:0 15px 24px}.layout{grid-template-columns:minmax(0,1fr) minmax(245px,32%)}.side{padding:17px;gap:13px}.stage{height:355px}.stageHead{top:12px;left:13px}.legend{display:none}.mast{padding:20px 0}.hint{font-size:11px;left:12px}.stageNav{padding:10px}.lower{gap:22px}}
@media(max-width:650px){.top{min-height:52px;gap:9px}.brand{font-size:17px;gap:6px}.brand svg{width:27px}.crumb{display:none}.markDemo{font-size:11px}.restart{font-size:11px}.mast{align-items:flex-start;flex-direction:column;gap:13px}.mast h1{font-size:36px}.switch button{padding:6px 10px}.layout,.lower{grid-template-columns:1fr}.stage{height:clamp(260px,65vw,360px)}.side{gap:12px}.side h2{font-size:32px}.stageHead strong{font-size:14px}.sideTop .label{margin:0}.lower{gap:20px}.hint{bottom:7px}.role{margin-top:-4px}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><span class="brand"><svg aria-hidden="true" viewBox="0 0 36 34"><rect x="2" y="6" width="31" height="24" rx="7" fill="currentColor"/><path d="M17 6V2h7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M9 14h5v5H9zm11 0h5v5h-5z" fill="var(--paper)"/></svg>Intern-Bot</span><span class="crumb">Applications</span><span class="markDemo"><i></i>Simulation</span><button class="restart" id="reset">Restart demo</button></header>
<div class="mast"><h1 id="title">Application workshop</h1><div class="switch" aria-label="Scene"><button id="workshop" aria-pressed="true">Workshop</button><button id="field" aria-pressed="false">Bar field</button></div></div>
<div class="layout"><section class="left" aria-label="Worker simulation"><div class="stage" id="stage"><div class="stageHead"><span class="label" id="sceneKind">Workshop floor</span><strong id="sceneLabel">Intake · Fill · Verify · Dispatch</strong></div><span class="hint">Drag to turn · Arrow keys to rotate</span><span class="legend" id="legend">Orange folder = current application</span></div><div class="stageNav"><i class="phaseDot"></i><span id="live">Crew standing by.</span><button id="play">Run demo</button></div></section>
<aside class="side" aria-label="Selected application"><div class="sideTop"><span class="label">Application</span><span class="status" id="status"></span></div><h2 id="company"></h2><p class="role" id="role"></p><div class="meter"><strong id="count"></strong><small>fields verified</small><div class="bar" id="bar" aria-hidden="true"></div></div><section class="task" aria-live="polite"><h3 id="taskTitle"></h3><p id="taskBody"></p><div class="actions" id="actions"></div></section></aside></div>
<div class="lower"><section><h2>Applications</h2><div class="records" id="records"></div></section><section><h2>Activity</h2><ol class="events" id="events"></ol></section></div>
</main>
<script src="three.min.js"></script><script src="scene.js"></script><script src="demo.js"></script>
</body></html>
