<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Intern-Bot: fill internship applications locally, track them from saved to offer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#132a22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#2fbf71" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2fbf71" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 76px; font-weight: 800; fill: #ffffff; letter-spacing: -2px; }
    .tag { font-size: 24px; font-weight: 500; fill: #cbd5e1; }
    .chip { font-size: 17px; font-weight: 600; }
  </style>

  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="320" rx="24" fill="url(#glow)"/>

  <!-- Bot mark -->
  <g transform="translate(80 92)">
    <line x1="56" y1="0" x2="56" y2="18" stroke="#2fbf71" stroke-width="5" stroke-linecap="round"/>
    <circle cx="56" cy="0" r="7" fill="#2fbf71"/>
    <rect x="0" y="18" width="112" height="96" rx="26" fill="#1e293b" stroke="#2fbf71" stroke-width="4"/>
    <circle cx="36" cy="62" r="11" fill="#2fbf71"/>
    <circle cx="76" cy="62" r="11" fill="#2fbf71"/>
    <path d="M38 90 Q56 102 74 90" fill="none" stroke="#2fbf71" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="232" y="150" class="title">Intern-Bot</text>
  <text x="236" y="192" class="tag">Fill internship applications locally. Track them from saved to offer.</text>

  <!-- Pipeline -->
  <g transform="translate(236 228)">
    <rect x="0" y="0" width="92" height="36" rx="18" fill="#ffffff" fill-opacity="0.08"/>
    <text x="46" y="24" class="chip" fill="#cbd5e1" text-anchor="middle">Saved</text>
    <path d="M102 18 h22" stroke="#7d8594" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="134" y="0" width="106" height="36" rx="18" fill="#ffffff" fill-opacity="0.08"/>
    <text x="187" y="24" class="chip" fill="#cbd5e1" text-anchor="middle">Applied</text>
    <path d="M250 18 h22" stroke="#7d8594" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="282" y="0" width="126" height="36" rx="18" fill="#e5a50a" fill-opacity="0.18"/>
    <text x="345" y="24" class="chip" fill="#f5c451" text-anchor="middle">Interview</text>
    <path d="M418 18 h22" stroke="#7d8594" stroke-width="2" stroke-dasharray="3 4"/>
    <rect x="450" y="0" width="92" height="36" rx="18" fill="#2fbf71"/>
    <text x="496" y="24" class="chip" fill="#0f172a" text-anchor="middle">Offer</text>
  </g>

  <text x="1200" y="290" text-anchor="end" font-size="15" fill="#7d8594">macOS · Python · PySide6 · Playwright</text>
</svg>
