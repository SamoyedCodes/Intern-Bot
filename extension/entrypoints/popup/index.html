<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intern-Bot Autofill</title>
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Intern-Bot</h1>
        <p id="profileStatus">No profile imported</p>
      </header>

      <section class="controls">
        <label class="fileButton">
          Import profile JSON
          <input id="profileFile" type="file" accept="application/json,.json" />
        </label>
        <button id="fillVisible" type="button">Fill visible fields</button>
      </section>

      <p id="result" class="result"></p>
    </main>
  </body>
</html>
