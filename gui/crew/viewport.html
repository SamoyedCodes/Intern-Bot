<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' qrc:; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'">
<title>Orbit chart</title>
<style>
*{margin:0;box-sizing:border-box}
html,body,#stage{width:100%;height:100%;overflow:hidden}
body{background:transparent;font:12px/1.3 -apple-system,"Helvetica Neue",sans-serif;color:#eef0fa;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
#stage{position:relative;border-radius:14px 14px 0 0;background:radial-gradient(85% 75% at 48% 46%,#1d2656,#0b1027 72%)}
canvas{display:block;width:100%;height:100%;cursor:grab}
canvas:active{cursor:grabbing}
:focus-visible{outline:2px solid #ffd596;outline-offset:2px}
canvas:focus-visible{outline-offset:-3px;border-radius:14px 14px 0 0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
[hidden]{display:none!important}
#overlay{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.wl{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.station{display:flex;align-items:center;gap:6px;padding:3px 3px 3px 9px;border-radius:10px;background:rgba(15,21,50,.78);font:500 12px/1 Futura,"Avenir Next",sans-serif;letter-spacing:.02em;color:#c3cae6;pointer-events:auto;transition:background-color .15s ease-out}
.station:hover{background:#39437c;color:#fff}
.station b{color:#eef0fa;font-weight:inherit}
.station i{font-style:normal;min-width:18px;padding:3px 5px;border-radius:9px;text-align:center;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
div.station{pointer-events:none}
.more{font-size:11px;color:#a4acd0}
.tag{display:grid;gap:3px;margin-top:-20px;padding:7px 11px 8px;border-radius:11px;background:rgba(21,28,64,.92);border:1px solid rgba(170,184,245,.22);box-shadow:0 18px 36px -14px rgba(0,0,0,.8);color:#c3cae6}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:20px;background:#eef0fa}
.tag b{font-size:13px;color:#fff}
.tag span{display:flex;align-items:center;gap:6px}
.tag i{width:8px;height:8px;border-radius:50%}
.tag.hover{margin-top:0;padding:4px 9px 5px;border-radius:8px;font-size:12px;font-weight:600;color:#fff}
.tag.hover::after{content:none}
.empty{font-size:13px;color:#c3cae6}
#place{position:absolute;left:18px;top:14px;pointer-events:none}
#place h1{font:500 30px/1 Futura,"Avenir Next",sans-serif;letter-spacing:-.01em}
#place p{margin-top:4px;color:#c3cae6}
#presets{position:absolute;right:12px;top:12px;display:flex;padding:3px;border-radius:10px;background:rgba(21,28,64,.86);border:1px solid rgba(170,184,245,.2)}
#presets button{height:24px;padding:0 10px;border-radius:7px;font-size:12px;font-weight:600;color:#c3cae6;transition:background-color .18s ease-out,color .18s ease-out}
.still *{transition:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
#presets button:hover{color:#fff}
#presets button[aria-pressed=true]{background:rgba(255,255,255,.16);color:#fff}
</style></head>
<body><div id="stage"><div id="overlay"></div>
<div id="place" hidden><h1></h1><p></p></div>
<div id="presets" role="group" aria-label="Camera angle"><button type="button" aria-pressed="true">3D</button><button type="button" aria-pressed="false">Top</button><button type="button" aria-pressed="false">Side</button></div>
</div><script src="qrc:///qtwebchannel/qwebchannel.js"></script><script src="three.min.js"></script><script src="scene.js"></script><script src="connect.js"></script></body></html>
